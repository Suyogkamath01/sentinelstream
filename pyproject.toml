[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sentinelstream"
version = "0.1.0"
description = "A distributed, explainable, drift-aware financial fraud detection platform."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "SentinelStream contributors" }]
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=16,<24",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.5,<2",
    "confluent-kafka>=2.5,<3",
]

[project.scripts]
sentinel-generate = "sentinelstream.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pre-commit>=3.8,<5",
    "pytest>=8.3,<10",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "types-PyYAML>=6.0,<7",
]

ml = [
    "imbalanced-learn>=0.12,<1",
    "mlflow-skinny>=2.15,<4",
    "shap>=0.45,<1",
    "xgboost>=2.1,<4",
]

spark = [
    "pyspark==4.2.0",
]

database = [
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.0,<9",
    "sqlalchemy>=2.0,<3",
]

api = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "PyJWT>=2.9,<3",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.30,<1",
]

dashboard = [
    "streamlit>=1.38,<2",
]

research = [
    "matplotlib>=3.9,<4",
]

mlops = [
    "mlflow-skinny>=2.15,<4",
    "optuna>=3.6,<5",
]

monitoring = [
    "evidently>=0.4,<1",
    "prometheus-client>=0.20,<1",
]

security = [
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelstream"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: fast isolated tests",
    "integration: tests spanning application components",
    "api: HTTP API tests",
    "kafka: Kafka transport and topic tests",
    "spark: Spark Structured Streaming tests",
    "database: database and cache tests",
    "mlops: model lifecycle tests",
    "monitoring: metrics, health, and drift tests",
    "security: authentication, authorization, privacy, and secure-runtime tests",
    "performance: lightweight benchmark framework tests",
    "research: reproducible research and evaluation tests",
    "slow: tests requiring extended runtime or external services",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["sentinelstream"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = '(^|/)(build|dist|\.venv)/'

[tool.coverage.run]
source = ["src/sentinelstream"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "pragma: no cover",
]
