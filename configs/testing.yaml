environment: testing
log_level: WARNING
kafka:
  bootstrap_servers: localhost:9092
  consumer_group: sentinelstream-test
  auto_offset_reset: earliest
  retry_attempts: 1
  retry_backoff_seconds: 0.0
spark:
  master: local[2]
  checkpoint_dir: data/checkpoints/test
  batch_interval_seconds: 1.0
  starting_offsets: earliest
  shuffle_partitions: 2
  kafka_connector_package: null
simulation:
  random_seed: 7
  customer_count: 20
  merchant_count: 10
  fraud_ratio: 0.10
