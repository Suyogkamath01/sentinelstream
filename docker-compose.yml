name: sentinelstream

networks:
  sentinelstream:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  mlflow-data:
  prometheus-data:
  grafana-data:
  streaming-data:

services:
  postgres:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelstream}
      POSTGRES_USER: ${POSTGRES_USER:-sentinelstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelstream-dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [sentinelstream]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    networks: [sentinelstream]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [sentinelstream]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.9.0
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    networks: [sentinelstream]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        for topic in
        sentinelstream.transactions.v1
        sentinelstream.validated-transactions.v1
        sentinelstream.predictions.v1
        sentinelstream.alerts.v1
        sentinelstream.feedback.v1
        sentinelstream.audit.v1
        sentinelstream.dead-letter.v1;
        do /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic "$${topic}" --partitions 6 --replication-factor 1;
        done

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: sentinelstream
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    networks: [sentinelstream]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.4.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg://${POSTGRES_USER:-sentinelstream}:${POSTGRES_PASSWORD:-sentinelstream-dev}@postgres:5432/${POSTGRES_DB:-sentinelstream}
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql+psycopg://${POSTGRES_USER:-sentinelstream}:${POSTGRES_PASSWORD:-sentinelstream-dev}@postgres:5432/${POSTGRES_DB:-sentinelstream}
      - --default-artifact-root
      - /mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    networks: [sentinelstream]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: docker/fastapi.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SENTINELSTREAM_ENVIRONMENT: ${SENTINELSTREAM_ENVIRONMENT:-development}
      SENTINELSTREAM_API__HOST: 0.0.0.0
      SENTINELSTREAM_DATABASE__URL: postgresql+psycopg://${POSTGRES_USER:-sentinelstream}:${POSTGRES_PASSWORD:-sentinelstream-dev}@postgres:5432/${POSTGRES_DB:-sentinelstream}
      SENTINELSTREAM_REDIS__URL: redis://redis:6379/0
      SENTINELSTREAM_KAFKA__BOOTSTRAP_SERVERS: kafka:9092
      SENTINELSTREAM_MLOPS__TRACKING_URI: http://mlflow:5000
      SENTINELSTREAM_MONITORING__MLFLOW_HEALTH_URL: http://mlflow:5000/health
      SENTINELSTREAM_SECRET_KEY: ${SENTINELSTREAM_SECRET_KEY:-local-development-secret-change-me-32-chars}
      SENTINELSTREAM_DASHBOARD__AUTH_USERNAME: ${SENTINELSTREAM_DASHBOARD__AUTH_USERNAME:-analyst}
      SENTINELSTREAM_DASHBOARD__AUTH_PASSWORD: ${SENTINELSTREAM_DASHBOARD__AUTH_PASSWORD:-sentinelstream-demo-password}
      RUN_MIGRATIONS: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    networks: [sentinelstream]
    volumes:
      - streaming-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15

  kafka-validator:
    build:
      context: .
      dockerfile: docker/fastapi.Dockerfile
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    entrypoint: ["python", "scripts/run_kafka_validator.py"]
    environment:
      SENTINELSTREAM_ENVIRONMENT: ${SENTINELSTREAM_ENVIRONMENT:-development}
      SENTINELSTREAM_KAFKA__BOOTSTRAP_SERVERS: kafka:9092
      SENTINELSTREAM_SECRET_KEY: ${SENTINELSTREAM_SECRET_KEY:-local-development-secret-change-me-32-chars}
    networks: [sentinelstream]

  spark-master:
    image: apache/spark:4.2.0-python3
    restart: unless-stopped
    command: ["/bin/bash", "-lc", "/opt/spark/sbin/start-master.sh && tail -f /dev/null"]
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "${SPARK_UI_PORT:-8081}:8080"
    networks: [sentinelstream]

  spark-worker:
    image: apache/spark:4.2.0-python3
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_started
    command: ["/bin/bash", "-lc", "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /dev/null"]
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
    networks: [sentinelstream]

  spark-streaming:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      SENTINELSTREAM_ENVIRONMENT: ${SENTINELSTREAM_ENVIRONMENT:-development}
      SENTINELSTREAM_KAFKA__BOOTSTRAP_SERVERS: kafka:9092
      SENTINELSTREAM_SPARK__MASTER: spark://spark-master:7077
      SENTINELSTREAM_SPARK__CHECKPOINT_DIR: /app/data/checkpoints/sentinelstream
      SENTINELSTREAM_SPARK__STARTING_OFFSETS: latest
      SENTINELSTREAM_SPARK__POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sentinelstream}
      SENTINELSTREAM_SPARK__POSTGRES_USER: ${POSTGRES_USER:-sentinelstream}
      SENTINELSTREAM_SPARK__POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelstream-dev}
      SENTINELSTREAM_DATABASE__URL: postgresql+psycopg://${POSTGRES_USER:-sentinelstream}:${POSTGRES_PASSWORD:-sentinelstream-dev}@postgres:5432/${POSTGRES_DB:-sentinelstream}
      SENTINELSTREAM_SECRET_KEY: ${SENTINELSTREAM_SECRET_KEY:-local-development-secret-change-me-32-chars}
    volumes:
      - streaming-data:/app/data
    networks: [sentinelstream]

  prometheus:
    image: prom/prometheus:v3.4.1
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks: [sentinelstream]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-sentinelstream-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks: [sentinelstream]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SENTINELSTREAM_ENVIRONMENT: ${SENTINELSTREAM_ENVIRONMENT:-development}
      SENTINELSTREAM_DASHBOARD__API_URL: http://api:8000
      SENTINELSTREAM_DASHBOARD__VERIFY_TLS: "false"
      SENTINELSTREAM_DASHBOARD__REFRESH_SECONDS: ${DASHBOARD_REFRESH_SECONDS:-10}
      SENTINELSTREAM_DATABASE__URL: postgresql+psycopg://${POSTGRES_USER:-sentinelstream}:${POSTGRES_PASSWORD:-sentinelstream-dev}@postgres:5432/${POSTGRES_DB:-sentinelstream}
      SENTINELSTREAM_SECRET_KEY: ${SENTINELSTREAM_SECRET_KEY:-local-development-secret-change-me-32-chars}
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    networks: [sentinelstream]
