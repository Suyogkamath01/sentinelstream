name: Main branch validation

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  full-local-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: make install
      - run: make check
      - run: uv run pytest --cov=sentinelstream --cov-report=xml --cov-report=term-missing
      - run: uv run python scripts/validate_docs.py
      - run: uv run python scripts/benchmark.py --suite inference --iterations 5 --warmup 1 --output reports/benchmarks/ci-smoke.json
      - run: docker compose config --quiet
      - name: Upload validation artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-validation
          path: |
            coverage.xml
            reports/benchmarks/ci-smoke.json
