name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version or tag to publish, for example v0.2.0
        required: true
        type: string
      publish-images:
        description: Publish validated images to GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: make install
      - run: make check
      - run: uv run python scripts/validate_docs.py
      - run: docker compose config --quiet

  publish-images:
    needs: validate
    if: inputs.publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            file: docker/fastapi.Dockerfile
          - name: dashboard
            file: docker/dashboard.Dockerfile
          - name: spark
            file: docker/spark.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sentinelstream-${{ matrix.name }}:${{ inputs.version }}
