name: Security scanning

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "31 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-and-static-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare Gitleaks baseline
        id: gitleaks-baseline
        if: github.event_name == 'push'
        shell: bash
        env:
          HEAD_SHA: ${{ github.sha }}
          FIRST_PUSH_COMMIT: ${{ github.event.commits[0].id }}
        run: |
          if git rev-parse --verify "${FIRST_PUSH_COMMIT}^{commit}" >/dev/null 2>&1 \
            && git rev-parse --verify "${FIRST_PUSH_COMMIT}^" >/dev/null 2>&1; then
            echo "base_ref=${FIRST_PUSH_COMMIT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          second_commit="$(git rev-list --reverse "${HEAD_SHA}" | sed -n '2p')"
          if [[ -n "${second_commit}" ]]; then
            echo "base_ref=${second_commit}" >> "$GITHUB_OUTPUT"
          else
            echo "base_ref=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --frozen --group security --group dev --group research
      - run: uv run bandit -r src -q
      - run: uv run pip-audit
      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ steps.gitleaks-baseline.outputs.base_ref }}
      - name: Scan repository configuration with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - name: Upload Trivy report
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
